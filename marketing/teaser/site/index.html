<style>
  * { margin: 0; padding: 0; box-sizing: border-box }
  body { min-height: 100vh; min-height: 100svh; padding: 0 20px; overflow-x: hidden; background: #121110; color: #f3efe9; font-family: 'Public Sans', sans-serif; text-align: center }
  main { max-width: 860px; margin: 0 auto }
  h1 { font: 700 clamp(2.3rem, 8vw, 4.2rem)/1.12 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em; animation: rise .9s cubic-bezier(.2,.8,.2,1) both }
  h1 em, h2 em { font-style: normal; color: #d0652b }
  .stage { position: relative; height: 270px; margin-top: 28px }
  .gavel { position: absolute; left: 50%; top: 82px; width: 308px; height: 175px; margin-left: -154px; animation: gone .4s ease-in 2.2s both }
  .gavel svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible }
  .hammer { transform-origin: 89.8% 46%; animation: strike 1.3s .7s both }
  .reveal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; animation: pop .9s cubic-bezier(.2,.8,.2,1) 2.5s both }
  .reveal img { width: 130px; height: 130px }
  .name { white-space: nowrap; font: 700 clamp(1.5rem, 6vw, 2.6rem) 'Bricolage Grotesque', sans-serif }
  .soon { display: inline-block; margin-top: 18px; padding: 13px 28px; border: 2px solid #d0652b; border-radius: 99px; color: #f2a272; font-size: .95rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; animation: rise .8s ease-out 3.2s both }
  a { display: block; width: fit-content; margin: 34px auto 0; color: #958d84; text-decoration: none; animation: rise .8s ease-out 3.5s both }
  a:hover, a:focus-visible { color: #f3efe9 }
  main.hit { animation: shake .35s linear }
  .hero { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 0 }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) } }
  @keyframes pop { from { opacity: 0; transform: scale(1.2) } }
  @keyframes gone { to { opacity: 0; visibility: hidden } }
  @keyframes strike {
    0% { opacity: 0; transform: rotate(0) } 20% { opacity: 1 }
    55% { transform: rotate(34deg); animation-timing-function: ease-out }
    68% { transform: rotate(34deg); animation-timing-function: cubic-bezier(.7,0,1,1) }
    85% { transform: rotate(0) } 92% { transform: rotate(7deg) } 100% { opacity: 1; transform: rotate(0) }
  }
  @keyframes shake { 20% { transform: translateY(10px) } 40% { transform: translateY(-7px) } 60% { transform: translateY(4px) } 80% { transform: translateY(-2px) } }
  @media (prefers-reduced-motion: reduce) { *, main.hit { animation: none !important } .gavel { display: none } }
  h1, .name, .clock { font-optical-sizing: none; font-variation-settings: 'opsz' 24 }
</style>
